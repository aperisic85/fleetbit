server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /aisapi/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws {
        proxy_pass http://api:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /camera/ {
        proxy_pass http://192.168.81.251/;
        proxy_set_header Host 192.168.81.251;
        proxy_set_header Authorization "Basic cm9vdDpwbG92cHV0";
        proxy_buffering off;
        proxy_cache off;
    }

    location = /svante {
        return 301 /svante/;
    }

    location /svante/ws {
        proxy_pass http://api:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /svante/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /svante/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
