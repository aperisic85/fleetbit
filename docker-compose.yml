services:
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: fleetbit_db
    environment:
      POSTGRES_USER: fleetbit
      POSTGRES_PASSWORD: fleetbit
      POSTGRES_DB: fleetbit
    volumes:
      - fleetbit_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetbit"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fleetbit_net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: fleetbit_api
    environment:
      DATABASE_URL: postgres://fleetbit:fleetbit@db:5432/fleetbit
      BIND_ADDR: 0.0.0.0:3001
      RUST_LOG: info
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - fleetbit_net

  frontend_charter:
    build:
      context: .
      dockerfile: Dockerfile.frontend.charter
    container_name: fleetbit_frontend_charter
    ports:
      - "8087:80"
    depends_on:
      - api
    networks:
      - fleetbit_net

  frontend_aton:
    build:
      context: .
      dockerfile: Dockerfile.frontend.aton
    container_name: fleetbit_frontend_aton
    ports:
      - "8088:80"
    depends_on:
      - api
    networks:
      - fleetbit_net

  frontend_svante:
    build:
      context: .
      dockerfile: Dockerfile.frontend.svante
    container_name: fleetbit_frontend_svante
    ports:
      - "8089:80"
    depends_on:
      - api
    networks:
      - fleetbit_net

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: fleetbit_migrate
    environment:
      DATABASE_URL: postgres://fleetbit:fleetbit@db:5432/fleetbit
    volumes:
      - ./migrations:/migrations
    working_dir: /migrations
    depends_on:
      db:
        condition: service_healthy
    restart: no
    networks:
      - fleetbit_net

  ingestor:
    build:
      context: .
      dockerfile: Dockerfile.ingestor
    container_name: fleetbit_ingestor
    environment:
      DATABASE_URL: postgres://fleetbit:fleetbit@127.0.0.1:5432/fleetbit
      RUST_LOG: info
      STATIONS_CONFIG: /config/stations.toml
    volumes:
      - ./stations.toml:/config/stations.toml:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    network_mode: host

volumes:
  fleetbit_data:

networks:
  fleetbit_net:
    name: fleetbit_net
